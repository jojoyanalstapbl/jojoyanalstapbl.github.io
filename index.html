<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сыграем?</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: #141414;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Georgia', serif;
      color: #d4af37;
    }
    .container {
      position: relative;
      width: 400px;
      height: 480px;
      border-radius: 20px;
      overflow: hidden;
      background: #1e1b18;
      border: 2px solid #b39239;
      box-shadow: 0 15px 35px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px;
      text-align: center;
    }
    
    /* Контент плавно проявляется по мере стирания */
    .inner-content {
      opacity: 0;
      transform: scale(0.95);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }
    .inner-content.revealed {
      opacity: 1;
      transform: scale(1);
    }

    h2 {
      font-size: 24px;
      margin-bottom: 35px;
      color: #e6c662;
    }
    .buttons {
      position: relative;
      width: 100%;
      height: 100px;
      display: flex;
      justify-content: center;
      gap: 30px;
    }
    .btn {
      padding: 14px 32px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      border: 1px solid #d4af37;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .btn-yes {
      background: #d4af37;
      color: #141414;
    }
    .btn-yes:hover {
      background: #f3e5ab;
      transform: scale(1.05);
    }
    .btn-no {
      background: #2b251a;
      color: #d4af37;
      position: absolute;
    }
    .btn-no:hover {
      background: #3d3424;
    }

    /* Скретч-слой */
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
      touch-action: none;
    }
  </style>
</head>
<body>

<div class="container" id="mainCard">
  <div class="inner-content" id="innerContent">
    <h2>Желаете сыграть в игру?</h2>
    <div class="buttons">
      <button class="btn btn-yes" id="yesBtn">Да</button>
      <button class="btn btn-no" id="noBtn">Нет</button>
    </div>
  </div>
  <canvas id="scratch"></canvas>
</div>

<script>
  const WEBASK_URL = 'https://a69862.webask.io/eicoenfpb';

  // Аудио-контекст для звуковых эффектов без внешних файлов
  let audioCtx = null;
  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
  }

  // Звук клика / успеха при нажатии «Да»
  function playSuccessSound() {
    try {
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(440, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
    } catch (e) {}
  }

  // Тихий шуршащий звук при стирании
  function playScratchSound() {
    try {
      initAudio();
      if (Math.random() > 0.3) return; // Чтобы звук не был слишком частым
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(120 + Math.random() * 80, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.05);
    } catch (e) {}
  }

  const yesBtn = document.getElementById('yesBtn');
  const noBtn = document.getElementById('noBtn');
  const innerContent = document.getElementById('innerContent');

  yesBtn.addEventListener('click', () => {
    playSuccessSound();
    setTimeout(() => {
      window.location.href = WEBASK_URL;
    }, 200);
  });

  // Убегающая кнопка «Нет»
  function moveNoButton() {
    const maxX = 180;
    const maxY = 60;
    const randomX = (Math.random() - 0.5) * maxX;
    const randomY = (Math.random() - 0.5) * maxY;
    noBtn.style.transform = `translate(${randomX}px, ${randomY}px)`;
  }

  noBtn.addEventListener('mouseover', moveNoButton);
  noBtn.addEventListener('touchstart', (e) => {
    e.preventDefault();
    moveNoButton();
    noBtn.textContent = '💋';
  });

  // Логика скретч-карты с анимацией пульсации текста
  const canvas = document.getElementById('scratch');
  const ctx = canvas.getContext('2d');
  let isDrawing = false;
  let pulseAngle = 0;

  function init() {
    canvas.width = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;
    drawScratchLayer();
    requestAnimationFrame(animatePulse);
  }

  function drawScratchLayer() {
    ctx.fillStyle = '#8c7323';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // Эффект легкой текстуры золота
    ctx.fillStyle = '#f3e5ab';
    ctx.font = 'bold 18px Georgia, serif';
    ctx.textAlign = 'center';
    ctx.fillText('Сотри, чтобы начать ✨', canvas.width / 2, canvas.height / 2);
  }

  // Анимация пульсации текста пока слой не стерт
  function animatePulse() {
    if (canvas.style.opacity === '0') return;
    pulseAngle += 0.05;
    // Очищаем и перерисовываем только если стерто совсем мало
    requestAnimationFrame(animatePulse);
  }

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: clientX - rect.left, y: clientY - rect.top };
  }

  function scratch(e) {
    if (!isDrawing) return;
    e.preventDefault();
    initAudio();
    playScratchSound();
    const pos = getPos(e);
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, 25, 0, Math.PI * 2);
    ctx.fill();
    checkPercent();
  }

  function checkPercent() {
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    let clearPixels = 0;
    for (let i = 3; i < imageData.data.length; i += 4) {
      if (imageData.data[i] === 0) clearPixels++;
    }
    const percent = (clearPixels / (imageData.data.length / 4)) * 100;
    
    // Как только стерли более 35%, плавно убираем холст и проявляем контент
    if (percent > 35) {
      canvas.style.pointerEvents = 'none';
      canvas.style.opacity = '0';
      canvas.style.transition = 'opacity 0.6s ease';
      innerContent.classList.add('revealed');
    }
  }

  canvas.addEventListener('mousedown', (e) => { isDrawing = true; scratch(e); });
  canvas.addEventListener('mousemove', scratch);
  canvas.addEventListener('mouseup', () => isDrawing = false);
  canvas.addEventListener('touchstart', (e) => { isDrawing = true; scratch(e); });
  canvas.addEventListener('touchmove', scratch);
  canvas.addEventListener('touchend', () => isDrawing = false);

  window.onload = init;
</script>

</body>
</html>
