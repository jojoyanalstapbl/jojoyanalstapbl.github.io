<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сыграем?</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,400&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at center, #242019 0%, #0d0c0a 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Playfair Display', serif;
      color: #d4af37;
      overflow: hidden;
      position: relative;
    }

    .bg-glow {
      position: absolute;
      width: 700px;
      height: 700px;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.06) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      animation: pulseGlow 4s ease-in-out infinite;
    }

    @keyframes pulseGlow {
      0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
      50% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.8; }
    }

    .container {
      position: relative;
      width: 440px;
      height: 380px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      text-align: center;
      z-index: 2;
    }
    
    .inner-content {
      opacity: 0;
      transform: scale(0.95);
      transition: opacity 0.8s ease, transform 0.8s ease;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .inner-content.revealed {
      opacity: 1;
      transform: scale(1);
    }

    h2 {
      font-size: 28px;
      margin-bottom: 25px;
      color: #f3e5ab;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .comment-box {
      font-size: 16px;
      font-style: italic;
      color: #e6c662;
      height: 30px;
      margin-bottom: 20px;
      transition: opacity 0.3s ease;
      text-align: center;
    }

    .btn-yes {
      padding: 16px 40px;
      font-size: 18px;
      font-family: 'Playfair Display', serif;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      border: 2px solid #d4af37;
      background: linear-gradient(135deg, #d4af37, #aa8c2c);
      color: #14120e;
      transition: all 0.4s ease;
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
      z-index: 5;
    }
    .btn-yes:hover {
      background: linear-gradient(135deg, #f3e5ab, #d4af37);
      transform: scale(1.05);
    }
    
    .btn-yes.fullscreen-mode {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      border-radius: 0;
      border: none;
      font-size: 64px;
      font-weight: 900;
      letter-spacing: 3px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      background: linear-gradient(135deg, #d4af37, #8c7323);
      color: #14120e;
      box-shadow: none;
    }

    /* Изначально кнопка НЕТ скрыта пока не сотрется слой */
    .btn-no {
      padding: 14px 30px;
      font-size: 16px;
      font-family: 'Playfair Display', serif;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      border: 1px solid #d4af37;
      background: #231f17;
      color: #d4af37;
      position: fixed;
      z-index: 999;
      transition: transform 0.1s ease-out;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      display: none; 
    }
    .btn-no.active {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-no:hover {
      background: #332d22;
    }

    .kiss-popup {
      position: fixed;
      font-size: 45px;
      opacity: 0;
      transform: scale(0.2);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
      z-index: 1000;
    }
    .kiss-popup.show {
      opacity: 1;
      transform: scale(1.3) translateY(-40px);
    }

    .heart-popup {
      position: fixed;
      font-size: 60px;
      opacity: 0;
      transform: scale(0.2);
      transition: all 0.8s ease-out;
      pointer-events: none;
      z-index: 1000;
    }
    .heart-popup.show {
      opacity: 1;
      transform: scale(2.5);
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      cursor: pointer;
      touch-action: none;
      z-index: 10;
    }

    .hint-tooltip {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: rgba(20, 18, 14, 0.85);
      border: 1px solid #d4af37;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 15px;
      color: #f3e5ab;
      opacity: 0;
      transition: opacity 0.5s ease, transform 0.5s ease;
      pointer-events: none;
      z-index: 11;
    }
    .hint-tooltip.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

<div class="bg-glow"></div>

<div class="container">
  <div class="inner-content" id="innerContent">
    <h2>Желаете сыграть в игру?</h2>
    <div class="comment-box" id="commentBox"></div>
    <button class="btn-yes" id="yesBtn">ДА</button>
  </div>
</div>

<canvas id="scratch"></canvas>

<div class="hint-tooltip" id="hintTooltip">💡 Подсказка: сотрите защитный слой в любой точке экрана</div>
<div class="kiss-popup" id="kissPopup">💋</div>
<div class="heart-popup" id="heartPopup">💖</div>

<button class="btn-no" id="noBtn">🔒 Нет</button>

<script>
  const WEBASK_URL = 'https://a69862.webask.io/eicoenfpb';

  let audioCtx = null;
  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
  }

  function playSuccessSound() {
    try {
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(1046.50, audioCtx.currentTime + 0.2);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.2);
    } catch (e) {}
  }

  function playKissSound() {
    try {
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(300, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
    } catch (e) {}
  }

  function playPencilSound() {
    try {
      initAudio();
      if (Math.random() > 0.4) return;
      const bufferSize = audioCtx.sampleRate * 0.03;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
      }
      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(800 + Math.random() * 400, audioCtx.currentTime);
      filter.Q.setValueAtTime(3, audioCtx.currentTime);
      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
      noise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      noise.start();
    } catch (e) {}
  }

  const yesBtn = document.getElementById('yesBtn');
  const noBtn = document.getElementById('noBtn');
  const innerContent = document.getElementById('innerContent');
  const kissPopup = document.getElementById('kissPopup');
  const heartPopup = document.getElementById('heartPopup');
  const hintTooltip = document.getElementById('hintTooltip');
  const commentBox = document.getElementById('commentBox');

  function placeNoButtonInitial() {
    const windowW = window.innerWidth;
    const windowH = window.innerHeight;
    noBtn.style.left = (windowW / 2 + 30) + 'px';
    noBtn.style.top = (windowH / 2 + 40) + 'px';
  }

  yesBtn.addEventListener('click', () => {
    playSuccessSound();
    setTimeout(() => {
      window.location.href = WEBASK_URL;
    }, 250);
  });

  let noClicksCount = 0;

  function handleNoClick(e) {
    if (e) e.preventDefault();
    noClicksCount++;

    if (noClicksCount <= 10) {
      commentBox.textContent = "Неееееееет";
    } else if (noClicksCount <= 22) {
      commentBox.textContent = 'Ты не понимаешь слова "нет"?';
    } else if (noClicksCount <= 38) {
      commentBox.textContent = "А ты настырный...";
    } else if (noClicksCount <= 41) {
      commentBox.textContent = "а так?";
      triggerKissAnimation();
    } else {
      commentBox.textContent = "Всё! УСТААААЛ!";
      triggerHeartAnimation();
      noBtn.style.display = 'none';
      yesBtn.classList.add('fullscreen-mode');
      return;
    }

    const maxX = window.innerWidth - noBtn.offsetWidth - 40;
    const maxY = window.innerHeight - noBtn.offsetHeight - 40;
    const randomX = Math.max(20, Math.floor(Math.random() * maxX));
    const randomY = Math.max(20, Math.floor(Math.random() * maxY));
    
    noBtn.style.left = randomX + 'px';
    noBtn.style.top = randomY + 'px';
  }

  noBtn.addEventListener('click', handleNoClick);
  noBtn.addEventListener('touchstart', handleNoClick);

  function triggerKissAnimation() {
    playKissSound();
    const noRect = noBtn.getBoundingClientRect();
    kissPopup.style.left = noRect.left + 'px';
    kissPopup.style.top = (noRect.top - 30) + 'px';
    kissPopup.classList.add('show');
    setTimeout(() => {
      kissPopup.classList.remove('show');
    }, 600);
  }

  function triggerHeartAnimation() {
    playKissSound();
    const noRect = noBtn.getBoundingClientRect();
    heartPopup.style.left = noRect.left + 'px';
    heartPopup.style.top = noRect.top + 'px';
    heartPopup.classList.add('show');
    setTimeout(() => {
      heartPopup.classList.remove('show');
    }, 900);
  }

  let hintTimer = setTimeout(() => {
    if (canvas.style.opacity !== '0') {
      hintTooltip.classList.add('visible');
    }
  }, 3500);

  const canvas = document.getElementById('scratch');
  const ctx = canvas.getContext('2d');
  let isDrawing = false;
  let isRevealed = false;

  function init() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    ctx.fillStyle = '#8c7323';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    placeNoButtonInitial();
  }

  window.addEventListener('resize', () => {
    if (!isRevealed) {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      ctx.fillStyle = '#8c7323';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
  });

  function getPos(e) {
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: clientX, y: clientY };
  }

  function scratch(e) {
    if (!isDrawing || isRevealed) return;
    e.preventDefault();
    initAudio();
    playPencilSound();
    
    clearTimeout(hintTimer);
    hintTooltip.classList.remove('visible');

    const pos = getPos(e);
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, 40, 0, Math.PI * 2);
    ctx.fill();
    checkPercent();
  }

  function checkPercent() {
    if (isRevealed) return;
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    let clearPixels = 0;
    for (let i = 3; i < imageData.data.length; i += 4) {
      if (imageData.data[i] === 0) clearPixels++;
    }
    const percent = (clearPixels / (imageData.data.length / 4)) * 100;
    
    if (percent > 20) {
      revealContent();
    }
  }

  function revealContent() {
    if (isRevealed) return;
    isRevealed = true;
    canvas.style.pointerEvents = 'none';
    canvas.style.opacity = '0';
    canvas.style.transition = 'opacity 0.6s ease';
    hintTooltip.style.opacity = '0';
    innerContent.classList.add('revealed');
    // Показываем кнопку «Нет» только после того, как слой стерт!
    noBtn.classList.add('active');
  }

  canvas.addEventListener('click', () => {
    revealContent();
  });

  canvas.addEventListener('mousedown', (e) => { isDrawing = true; scratch(e); });
  canvas.addEventListener('mousemove', scratch);
  canvas.addEventListener('mouseup', () => isDrawing = false);
  canvas.addEventListener('touchstart', (e) => { isDrawing = true; scratch(e); });
  canvas.addEventListener('touchmove', scratch);
  canvas.addEventListener('touchend', () => isDrawing = false);

  window.onload = init;
</script>

</body>
</html>
