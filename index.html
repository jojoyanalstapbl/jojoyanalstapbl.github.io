<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сыграем?</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,400&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at center, #242019 0%, #0d0c0a 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Playfair Display', serif;
      color: #d4af37;
      overflow: hidden;
      position: relative;
    }

    .bg-glow {
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.05) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      animation: pulseGlow 4s ease-in-out infinite;
    }

    @keyframes pulseGlow {
      0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
      50% { transform: translate(-50%, -50%) scale(1.1); opacity: 0.8; }
    }

    .container {
      position: relative;
      width: 440px;
      height: 520px;
      border-radius: 24px;
      overflow: hidden;
      background: linear-gradient(145deg, #1f1c16, #14120e);
      border: 2px solid #b39239;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8), inset 0 0 15px rgba(212, 175, 55, 0.1);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 35px;
      text-align: center;
      z-index: 2;
    }
    
    .inner-content {
      opacity: 0;
      transform: scale(0.95);
      transition: opacity 0.8s ease, transform 0.8s ease;
      width: 100%;
    }
    .inner-content.revealed {
      opacity: 1;
      transform: scale(1);
    }

    h2 {
      font-size: 26px;
      margin-bottom: 20px;
      color: #f3e5ab;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .comment-box {
      font-size: 15px;
      font-style: italic;
      color: #c2a64e;
      height: 25px;
      margin-bottom: 15px;
      transition: opacity 0.3s ease;
    }

    .buttons {
      position: relative;
      width: 100%;
      height: 100px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
    }

    .btn {
      padding: 14px 30px;
      font-size: 16px;
      font-family: 'Playfair Display', serif;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      border: 1px solid #d4af37;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-yes {
      background: linear-gradient(135deg, #d4af37, #aa8c2c);
      color: #14120e;
      z-index: 5;
    }
    .btn-yes:hover {
      background: linear-gradient(135deg, #f3e5ab, #d4af37);
      transform: scale(1.05);
    }
    
    .btn-yes.fullscreen-mode {
      width: 85%;
      padding: 18px;
      font-size: 18px;
      letter-spacing: 1px;
    }

    /* Абсолютно свободный полет по всему экрану */
    .btn-no {
      background: #231f17;
      color: #d4af37;
      position: fixed;
      z-index: 999;
      transition: all 0.1s ease-out;
    }
    .btn-no:hover {
      background: #332d22;
    }

    .kiss-popup {
      position: absolute;
      font-size: 45px;
      opacity: 0;
      transform: scale(0.2);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
      z-index: 10;
    }
    .kiss-popup.show {
      opacity: 1;
      transform: scale(1.2) translateY(-30px);
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
      touch-action: none;
    }

    .hint-tooltip {
      position: absolute;
      bottom: 20px;
      background: rgba(20, 18, 14, 0.85);
      border: 1px solid #d4af37;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      color: #f3e5ab;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.5s ease, transform 0.5s ease;
      pointer-events: none;
    }
    .hint-tooltip.visible {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

<div class="bg-glow"></div>

<div class="container" id="mainCard">
  <div class="inner-content" id="innerContent">
    <h2>Желаете сыграть в игру?</h2>
    <div class="comment-box" id="commentBox"></div>
    <div class="buttons" id="buttonsArea">
      <button class="btn btn-yes" id="yesBtn">✨ Да</button>
    </div>
  </div>
  
  <canvas id="scratch"></canvas>
  <div class="hint-tooltip" id="hintTooltip">💡 Подсказка: сотрите защитный слой</div>
  <div class="kiss-popup" id="kissPopup">💋</div>
</div>

<button class="btn btn-no" id="noBtn">🔒 Нет</button>

<script>
  const WEBASK_URL = 'https://a69862.webask.io/eicoenfpb';

  let audioCtx = null;
  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
  }

  function playSuccessSound() {
    try {
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(1046.50, audioCtx.currentTime + 0.2);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.2);
    } catch (e) {}
  }

  function playKissSound() {
    try {
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(300, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
    } catch (e) {}
  }

  function playPencilSound() {
    try {
      initAudio();
      if (Math.random() > 0.4) return;
      const bufferSize = audioCtx.sampleRate * 0.03;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
      }
      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(800 + Math.random() * 400, audioCtx.currentTime);
      filter.Q.setValueAtTime(3, audioCtx.currentTime);
      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
      noise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      noise.start();
    } catch (e) {}
  }

  const yesBtn = document.getElementById('yesBtn');
  const noBtn = document.getElementById('noBtn');
  const innerContent = document.getElementById('innerContent');
  const kissPopup = document.getElementById('kissPopup');
  const hintTooltip = document.getElementById('hintTooltip');
  const commentBox = document.getElementById('commentBox');

  // Ставим кнопку «Нет» рядом с «Да» при загрузке
  function placeNoButtonInitial() {
    const yesRect = yesBtn.getBoundingClientRect();
    noBtn.style.left = (yesRect.right + 25) + 'px';
    noBtn.style.top = yesRect.top + 'px';
  }

  yesBtn.addEventListener('click', () => {
    playSuccessSound();
    setTimeout(() => {
      window.location.href = WEBASK_URL;
    }, 250);
  });

  let noClicksCount = 0;
  const comments = [
    "Уверены? Подумайте еще раз ✨",
    "Кажется, эта кнопка не работает 🤫",
    "Ну же, сопротивление бесполезно!",
    "Остался только один правильный выбор 💕"
  ];

  function escapeNoButton() {
    noClicksCount++;
    
    if (noClicksCount <= comments.length) {
      commentBox.textContent = comments[noClicksCount - 1];
    }

    // После 4 кликов кнопка исчезает навсегда, «Да» заполняет пространство
    if (noClicksCount >= 4) {
      noBtn.style.display = 'none';
      commentBox.textContent = "Выбора больше нет! 😉";
      yesBtn.classList.add('fullscreen-mode');
      return;
    }

    // Расчет случайных координат по ВСЕМУ экрану браузера с отступами, чтобы кнопка не улетала за края
    const maxX = window.innerWidth - noBtn.offsetWidth - 30;
    const maxY = window.innerHeight - noBtn.offsetHeight - 30;
    const randomX = Math.max(30, Math.floor(Math.random() * maxX));
    const randomY = Math.max(30, Math.floor(Math.random() * maxY));
    
    noBtn.style.left = randomX + 'px';
    noBtn.style.top = randomY + 'px';
  }

  noBtn.addEventListener('mouseover', escapeNoButton);
  noBtn.addEventListener('touchstart', (e) => {
    e.preventDefault();
    escapeNoButton();
    triggerKissAnimation();
  });
  noBtn.addEventListener('click', (e) => {
    escapeNoButton();
    triggerKissAnimation();
  });

  function triggerKissAnimation() {
    playKissSound();
    const noRect = noBtn.getBoundingClientRect();
    kissPopup.style.left = (noRect.left + 10) + 'px';
    kissPopup.style.top = (noRect.top - 20) + 'px';
    kissPopup.classList.add('show');
    setTimeout(() => {
      kissPopup.classList.remove('show');
    }, 700);
  }

  let hintTimer = setTimeout(() => {
    if (canvas.style.opacity !== '0') {
      hintTooltip.classList.add('visible');
    }
  }, 3000);

  const canvas = document.getElementById('scratch');
  const ctx = canvas.getContext('2d');
  let isDrawing = false;

  function init() {
    canvas.width = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;
    ctx.fillStyle = '#8c7323';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    placeNoButtonInitial();
  }

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: clientX - rect.left, y: clientY - rect.top };
  }

  function scratch(e) {
    if (!isDrawing) return;
    e.preventDefault();
    initAudio();
    playPencilSound();
    
    clearTimeout(hintTimer);
    hintTooltip.classList.remove('visible');

    const pos = getPos(e);
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, 30, 0, Math.PI * 2);
    ctx.fill();
    checkPercent();
  }

  function checkPercent() {
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    let clearPixels = 0;
    for (let i = 3; i < imageData.data.length; i += 4) {
      if (imageData.data[i] === 0) clearPixels++;
    }
    const percent = (clearPixels / (imageData.data.length / 4)) * 100;
    
    if (percent > 25) {
      revealContent();
    }
  }

  function revealContent() {
    canvas.style.pointerEvents = 'none';
    canvas.style.opacity = '0';
    canvas.style.transition = 'opacity 0.6s ease';
    hintTooltip.style.opacity = '0';
    innerContent.classList.add('revealed');
  }

  canvas.addEventListener('click', () => {
    revealContent();
  });

  canvas.addEventListener('mousedown', (e) => { isDrawing = true; scratch(e); });
  canvas.addEventListener('mousemove', scratch);
  canvas.addEventListener('mouseup', () => isDrawing = false);
  canvas.addEventListener('touchstart', (e) => { isDrawing = true; scratch(e); });
  canvas.addEventListener('touchmove', scratch);
  canvas.addEventListener('touchend', () => isDrawing = false);

  window.onload = init;
</script>

</body>
</html>
