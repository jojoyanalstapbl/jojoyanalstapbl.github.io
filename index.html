<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сыграем?</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: #141414;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Georgia', serif;
      color: #d4af37; /* Тусклое золото */
    }
    .container {
      position: relative;
      width: 340px;
      height: 420px;
      border-radius: 16px;
      overflow: hidden;
      background: #1e1b18;
      border: 2px solid #b39239;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 25px;
      text-align: center;
    }
    h2 {
      font-size: 22px;
      margin-bottom: 30px;
      color: #e6c662;
    }
    .buttons {
      position: relative;
      width: 100%;
      height: 80px;
      display: flex;
      justify-content: center;
      gap: 20px;
    }
    .btn {
      padding: 12px 28px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      border: none;
      transition: background 0.2s;
    }
    .btn-yes {
      background: #d4af37;
      color: #141414;
    }
    .btn-yes:hover {
      background: #e6c662;
    }
    .btn-no {
      background: #4a4233;
      color: #d4af37;
      position: absolute;
    }
    /* Слой скретч-карты поверх */
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
      touch-action: none;
    }
  </style>
</head>
<body>

<div class="container" id="mainCard">
  <h2>Желаете сыграть в игру?</h2>
  <div class="buttons">
    <button class="btn btn-yes" id="yesBtn">Да</button>
    <button class="btn btn-no" id="noBtn">Нет</button>
  </div>
  <!-- Скретч-слой -->
  <canvas id="scratch"></canvas>
</div>

<script>
  const WEBASK_URL = 'https://a69862.webask.io/eicoenfpb';

  // Логика кнопок
  const yesBtn = document.getElementById('yesBtn');
  const noBtn = document.getElementById('noBtn');

  yesBtn.addEventListener('click', () => {
    window.location.href = WEBASK_URL;
  });

  // Убегающая кнопка «Нет»
  function moveNoButton() {
    const maxX = 160;
    const maxY = 40;
    const randomX = (Math.random() - 0.5) * maxX;
    const randomY = (Math.random() - 0.5) * maxY;
    noBtn.style.transform = `translate(${randomX}px, ${randomY}px)`;
  }

  noBtn.addEventListener('mouseover', moveNoButton);
  noBtn.addEventListener('touchstart', (e) => {
    e.preventDefault();
    moveNoButton();
    // Превращаем в поцелуй при попытке нажать
    noBtn.textContent = '💋';
  });

  // Логика скретч-карты
  const canvas = document.getElementById('scratch');
  const ctx = canvas.getContext('2d');
  let isDrawing = false;

  function init() {
    canvas.width = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;
    
    // Заливка защитного слоя под тусклое золото
    ctx.fillStyle = '#8c7323';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // Текст на защитном слое
    ctx.fillStyle = '#f3e5ab';
    ctx.font = 'bold 18px Georgia, serif';
    ctx.textAlign = 'center';
    ctx.fillText('Сотри, чтобы начать ✨', canvas.width / 2, canvas.height / 2);
  }

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: clientX - rect.left, y: clientY - rect.top };
  }

  function scratch(e) {
    if (!isDrawing) return;
    e.preventDefault();
    const pos = getPos(e);
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, 25, 0, Math.PI * 2);
    ctx.fill();
    checkPercent();
  }

  function checkPercent() {
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    let clearPixels = 0;
    for (let i = 3; i < imageData.data.length; i += 4) {
      if (imageData.data[i] === 0) clearPixels++;
    }
    const percent = (clearPixels / (imageData.data.length / 4)) * 100;
    
    if (percent > 35) {
      canvas.style.pointerEvents = 'none';
      canvas.style.opacity = '0';
      canvas.style.transition = 'opacity 0.5s ease';
    }
  }

  canvas.addEventListener('mousedown', (e) => { isDrawing = true; scratch(e); });
  canvas.addEventListener('mousemove', scratch);
  canvas.addEventListener('mouseup', () => isDrawing = false);
  canvas.addEventListener('touchstart', (e) => { isDrawing = true; scratch(e); });
  canvas.addEventListener('touchmove', scratch);
  canvas.addEventListener('touchend', () => isDrawing = false);

  window.onload = init;
</script>

</body>
</html>
